# =============================================================================
# CI — Build check on pull requests
# =============================================================================
#
# Runs on pull requests to main or dev.
# Installs dependencies and verifies the TypeScript build succeeds.
#
# =============================================================================

name: CI

on:
  pull_request:
    branches: [main, dev]

jobs:
  build:
    name: Build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build
